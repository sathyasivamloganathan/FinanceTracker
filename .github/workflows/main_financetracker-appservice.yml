# Test → audit → build → deploy the BACKEND to Azure App Service.
# (The frontend is deployed separately, e.g. on Vercel; it is built and linted here on every push.)
name: CI and deploy - FinanceTracker-appservice

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env: { BACKEND_URL: 'http://localhost:4000' }

  package:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x', cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Install production dependencies only
        working-directory: backend
        run: npm ci --omit=dev
      - uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: backend
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      id-token: write # request the OIDC JWT
      contents: read
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: node-app }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3AC6B88800AD45469FD727FDB221CE2C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DCA69AA4626742B7BE468B151CD2B24A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BA6A4565F8894567B9DA3D8DBCF189FA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'FinanceTracker-appservice'
          slot-name: 'Production'
          package: .

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy-to-webapp.outputs.webapp-url }}/api/ready" || true)
            [ "$code" = "200" ] && echo "ready" && exit 0
            sleep 10
          done
          echo "App did not become ready" && exit 1
